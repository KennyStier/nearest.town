<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Nearest Town</title>
</head>
<body>
    <h1>Nearest Town</h1>
    <p>Locates the nearest town using US Census place data</p>
    <p>Created by <a href="https://kstr.us" target="_blank">Kenny Stier</a> in <a href="https://millhousen.com" target="_blank">Millhousen</a></p>

    <form id ='latlong'>
        Latitude:    <input type='text' name='latitude'>
        Longitude:   <input type='text' name='longitude'>

        <input type="submit" value="Submit" id='smit' >
    </form>

    <div id="myData"></div>
    <script>
        // Our own API (api/ in this repo), served by Caddy at /api on this same host.
        var API = "/api/nearest/";

        document.getElementById('latlong').onsubmit = function (event) {
            event.preventDefault();
            var latitude = document.querySelector("#latlong [name='latitude']").value.trim();
            var longitude = document.querySelector("#latlong [name='longitude']").value.trim();
            fetch(API + encodeURIComponent(latitude) + "," + encodeURIComponent(longitude))
            .then(function (response) {
                return response.json().then(function (data) {
                    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
                    return data;
                });
            })
            .then(function (data) {
                show(data.text);
            })
            .catch(function (err) {
                show("Error: " + err.message);
            });
        };
        function show(message) {
            var div = document.createElement("div");
            div.textContent = message;
            document.getElementById("myData").appendChild(div);
        }
    </script>

    <!-- Matomo -->
<script type="text/javascript">
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */

    _paq.push(['enableLinkTracking']);

      var u="https://analytics.millhousen.tech/";

      g.type='text/javascript'; g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  </script>
  <!-- End Matomo Code -->
</body>
</html>
